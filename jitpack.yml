jdk:
  - openjdk21
install:
  # 官方分发不可用时按序回退镜像；Wrapper始终校验官方SHA256，正式构建不重试。
  - |
    wrapper=gradle/wrapper/gradle-wrapper.properties
    archive=$(sed -n 's#^distributionUrl=.*/##p' "$wrapper")
    ready=false
    for base in https://services.gradle.org/distributions/ https://repo.huaweicloud.com/gradle/ https://mirrors.cloud.tencent.com/gradle/; do
      sed -i "s#^distributionUrl=.*#distributionUrl=$base$archive#" "$wrapper"
      if ./gradlew --no-daemon --version; then ready=true; break; fi
    done
    if [ "$ready" != true ]; then exit 1; fi
    ./gradlew --no-daemon build publishToMavenLocal --console=plain
